# FXServer Network
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Server Info
sv_hostname "Grand RP by Sumit_Yadav"
sets sv_projectName "Grand RP Custom"
sets sv_projectDesc "CM-Core Framework - Built by Sumit_Yadav"
sets tags "rp, custom, cm-core"
sets locale "en-US"
sv_maxclients 48

# Game Build
sv_enforceGameBuild 3258

# Local secrets (license key, Steam API key, MySQL connection string, etc.)
# Values live in server.local.cfg, which is gitignored and never tracked by git.
exec server.local.cfg

set cm_environment "development"

# System Chat
set resources_useSystemChat true

# Admin Setup
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.fivem:1494046 group.admin
add_ace group.clothingadmin cm.clothing.admin allow
add_ace group.admin cm-house.create allow
add_principal identifier.license:1494046 group.admin

add_principal identifier.fivem:1494046 group.clothingadmin

add_ace group.admin cm-house.admin allow
add_ace group.admin cm-house.create allow
add_ace group.admin cm-house.admin.properties allow
add_ace group.admin cm-house.admin.interiors allow
add_ace group.admin cm-house.admin.garages allow
add_ace group.admin cm-house.admin.pricing allow
add_ace group.admin cm-house.admin.photos allow
add_ace group.admin cm-house.admin.recovery allow

