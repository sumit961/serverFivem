# Copy this file to server.local.cfg and replace every placeholder locally.
# Never commit server.local.cfg or real credential values.

# Cfx.re server license key
sv_licenseKey "CHANGE_ME"

# oxmysql connection string
set mysql_connection_string "mysql://USERNAME:PASSWORD@HOST:3306/DATABASE?charset=utf8mb4"

# Steam Web API key (only required when Steam integration is enabled)
set steam_webApiKey "CHANGE_ME_IF_USED"
