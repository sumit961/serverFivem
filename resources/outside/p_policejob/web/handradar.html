<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hand Radar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Bai Jamjuree', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 512px;
            height: 256px;
            overflow: hidden;
            background: transparent;
        }

        .screen {
            position: relative;
            width: 512px;
            height: 256px;
            display: flex;
            flex-direction: column;
            padding: 16px 26px;
            color: #2bff5b;
            background: transparent;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 4px;
        }

        .header .brand { opacity: .85; }

        .lock {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            opacity: .3;
            transition: all .12s ease;
        }

        .lock.active {
            opacity: 1;
            text-shadow: 0 0 16px #2bff5b;
        }

        .body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .speed {
            font-weight: 700;
            font-size: 128px;
            line-height: .9;
            text-shadow: 0 0 22px rgba(43, 255, 91, .6);
        }

        .unit {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 8px;
            margin-top: 2px;
            opacity: .85;
        }

        .plate {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(43, 255, 91, .5);
        }

        .screen.no-target .speed { opacity: .25; }
        .screen.no-target .plate { opacity: .35; }
    </style>
</head>
<body>
    <div class="screen no-target" id="screen">
        <div class="header">
            <span class="brand">RADAR</span>
            <span class="lock" id="lock">LOCK</span>
        </div>
        <div class="body">
            <div class="speed" id="speed">---</div>
            <div class="unit" id="unit">MPH</div>
            <div class="plate" id="plate">--------</div>
        </div>
    </div>

    <script>
        const el = id => document.getElementById(id);

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.action !== 'update') return;

            el('screen').classList.toggle('no-target', !data.target);
            el('lock').classList.toggle('active', !!data.locked);
            el('speed').innerText = data.target ? data.speed : '---';
            el('plate').innerText = data.plate || '--------';
            el('unit').innerText = data.unit || 'MPH';
        });
    </script>
</body>
</html>
