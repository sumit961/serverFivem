<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CM Items Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="preview.css?v=2.0.0" />
</head>
<body>
  <main id="app" class="hidden">
    <header>
      <div class="header-brand">
        <div class="brand-kicker">CENTRAL ITEM REGISTRY SYSTEM</div>
        <h1>CM ITEMS & CATALOG</h1>
        <div class="accent-line"></div>
        <p>Authoritative inventory registry & clothing catalog — right-click cards for options.</p>
      </div>
      <div class="actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search" type="text" placeholder="SEARCH ITEM, CATEGORY, DRAWABLE..." />
        </div>
        <select id="mode">
          <option value="all">ALL ENTRIES</option>
          <option value="items">ITEMS ONLY</option>
          <option value="catalog">CLOTHING CATALOG</option>
        </select>
        <button id="refresh" class="btn btn-ghost">REFRESH</button>
        <button id="close" class="btn btn-primary">CLOSE · ESC</button>
      </div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <section class="stats" id="stats"></section>
    <section class="grid" id="grid"></section>
  </main>

  <!-- Right-click context menu (built dynamically) -->
  <div id="ctxMenu" class="ctx hidden"></div>

  <div id="propModal" class="modal hidden">
    <div class="modal-card">
      <h2>Drop Prop</h2>
      <p class="modal-sub" id="propItemName"></p>
      <label>Prop model
        <input id="propModel" type="text" placeholder="prop_cs_cardbox_01" />
      </label>
      <div class="modal-row">
        <label>Z offset
          <input id="propZOffset" type="number" step="0.05" value="0" />
        </label>
        <label>Heading
          <input id="propHeading" type="number" step="5" value="0" />
        </label>
      </div>
      <p class="modal-hint">GTA can't scale props at runtime, so size is controlled by choosing the model + z-offset/heading. Clothing shares one prop for all clothes.</p>
      <div class="modal-actions">
        <button id="propSpawn" class="btn btn-ghost">Spawn test</button>
        <button id="propReset" class="btn btn-danger">Reset</button>
        <span class="spacer"></span>
        <button id="propCancel" class="btn btn-ghost">Cancel</button>
        <button id="propSave" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="preview.js?v=1.5.0"></script>
</body>
</html>
