<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CM Pets</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" aria-hidden="true">
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="title">
            <header class="panel__header">
                <div>
                    <p class="eyebrow">COSMETIC COMPANION</p>
                    <h1 id="title">My Pets</h1>
                </div>
                <button id="close" class="icon-button" type="button" aria-label="Close">×</button>
            </header>
            <div id="content" class="content"></div>
            <p id="status" class="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
