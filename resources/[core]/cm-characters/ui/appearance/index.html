<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Appearance</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="nui://cm-ui/web/cm-components.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:none">
    <div class="background">
        <!-- Categories -->
        <div class="categories"></div>

        <!-- Header -->
        <div class="header">
            <p id="headerName">CREATE YOUR CHARACTER</p>
            <p id="headerCategory">SELECT CATEGORY</p>
        </div>

        <!-- Panel (dynamic content) -->
        <div class="panel"></div>

        <!-- Settings / Controls -->
        <div class="settings">
            <div class="height">
                <p class="height-title" id="height-text">CAMERA HEIGHT</p>
                <div class="height-radius">
                    <input type="range" value="0.0" step="0.1" min="-1.0" max="1.0" id="height-input" class="input-option-radius" oninput="changeHeight()">
                </div>
            </div>
            <div class="rotate">
                <p class="rotate-title" id="rotate-text">CAMERA ROTATE</p>
                <div class="rotate-radius">
                    <input type="range" min="0" max="360" id="rotate-input" class="input-option-radius" oninput="changeRotate()">
                </div>
            </div>
            <div class="distance">
                <p class="distance-title" id="distance-text">CAMERA DISTANCE</p>
                <div class="distance-radius">
                    <input type="range" min="30" max="100" id="distance-input" class="input-option-radius" oninput="changeDistance()">
                </div>
            </div>
            <div class="actions">
                <div class="accept-skin" onclick="saveAppearance()">
                    <span class="accept-icon">✓</span>
                    <p id="save">SAVE & SPAWN</p>
                </div>
                <div class="hands-up" onclick="handsUp()">
                    <span>Hands</span>
                </div>
            </div>
        </div>
    </div>

    <script src="nui://cm-ui/web/cm-ui.js"></script>
    <script src="../vendor/cm-miniquery.js"></script>
    <script src="translation.js"></script>
    <script src="app.js"></script>
</body>
</html>
