<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" style="display: none;">
        
        <!-- Character Slots -->
        <div id="slots-screen">
            <h1>Select Character</h1>
            <div class="slots-container">
                <div class="slot" data-slot="1" onclick="selectSlot(1)">
                    <div class="slot-empty">Empty Slot</div>
                    <div class="slot-info" style="display: none;"></div>
                </div>
                <div class="slot" data-slot="2" onclick="selectSlot(2)">
                    <div class="slot-empty">Empty Slot</div>
                    <div class="slot-info" style="display: none;"></div>
                </div>
            </div>
            <div id="error-msg"></div>
        </div>

        <!-- Character Creator -->
        <div id="creator-screen" style="display: none;">
            <h1>Create Character</h1>
            <input type="text" id="first-name" placeholder="First Name" maxlength="20">
            <input type="text" id="last-name" placeholder="Last Name" maxlength="20">
            <input type="date" id="dob" placeholder="Date of Birth">
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <button onclick="createCharacter()">Create</button>
            <button class="back" onclick="showSlots()">Back</button>
            <div id="creator-error"></div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
