<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>CM Vehicle Store</title>
</head>
<body>
  <div id="toast" class="toast hidden"></div>
  <main id="store" class="store hidden">
    <div class="topbar">
      <div>
        <p class="eyebrow">Dealership</p>
        <h1 id="dealerName">Vehicle Store</h1>
        <p class="muted">Buy a vehicle. Garage/call vehicle will be added later.</p>
      </div>
      <button id="close">×</button>
    </div>
    <div id="vehicleGrid" class="grid"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
