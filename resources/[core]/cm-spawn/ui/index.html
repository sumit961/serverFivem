<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Spawn Selector</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="nui://cm-ui/web/cm-components.css">
    <link rel="stylesheet" href="nui://cm-ui/web/cm-icons.css">
    <link rel="stylesheet" href="nui://cm-ui/web/cm-aaa.css">
    <link rel="stylesheet" href="style.css">
    <script src="nui://cm-ui/web/cm-branding.js"></script>
</head>
<body>
    <div id="spawn-selector" class="cm-app">
        <header class="spawn-header">
            <div class="spawn-heading">
                <h1>SPAWN SELECTOR</h1>
                <p class="spawn-subtitle" id="spawn-subtitle">Select a spawn point to enter the city.</p>
            </div>

            <div class="player-summary" id="player-summary" style="display: none;">
                <div class="player-summary-text">
                    <span class="player-summary-name" id="player-summary-name"></span>
                    <span class="player-summary-cash" id="player-summary-cash"></span>
                </div>
                <div class="player-summary-avatar" id="player-summary-avatar"></div>
            </div>
        </header>

        <div class="dead-spawn-notice" id="dead-spawn-notice" style="display: none;">
            <span class="cm-spawn-symbol cm-spawn-symbol-danger">&#10084;</span>
            <span id="dead-spawn-text">You are still down. Any spawn choice will return you to your last body location.</span>
        </div>

        <main class="spawn-main">
            <div class="spawn-cards cm-scrollbar" id="spawn-cards"></div>
        </main>

        <footer class="spawn-footer">
            <div class="spawn-footer-status" id="spawn-footer-status"></div>
            <button type="button" class="cm-btn cm-action-skew cm-action-primary spawn-cta" id="spawn-cta" disabled>
                <span class="cm-action-skew-content"><span id="spawn-cta-text">SPAWN HERE</span><span class="btn-icon">&#10148;</span></span>
            </button>
        </footer>
    </div>

    <div id="tutorial" style="display: none;">
        <div class="tutorial-overlay">
            <div class="cm-screen-bracket cm-screen-bracket--bl"></div>
            <div class="cm-screen-bracket cm-screen-bracket--br"></div>
            <div class="tutorial-box">
                <div class="tutorial-step">
                    <span id="step-current">1</span> / <span id="step-total">4</span>
                </div>
                <h2 id="tutorial-title">Welcome</h2>
                <p id="tutorial-text">Loading...</p>
                <div class="tutorial-progress">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="tutorial-skip">Press <kbd>SPACE</kbd> to skip</p>
            </div>
        </div>
    </div>

    <script src="nui://cm-ui/web/cm-ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
