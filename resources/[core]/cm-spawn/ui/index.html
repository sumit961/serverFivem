<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Spawn Selector</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Spawn Selector -->
    <div id="spawn-selector" style="display: none;">
        <div class="spawn-header">
            <div class="spawn-title">
                <h1>SPAWN SELECTOR</h1>
                <p>Select a spawn point on the state map</p>
            </div>
            <div class="player-info">
                <div class="player-details">
                    <div class="player-name" id="player-name">PLAYER</div>
                    <div class="player-cash" id="player-cash">$0</div>
                </div>
                <div class="player-avatar" id="player-avatar"></div>
            </div>
        </div>

        <div class="spawn-grid" id="spawn-grid"></div>
    </div>

    <!-- Tutorial -->
    <div id="tutorial" style="display: none;">
        <div class="tutorial-overlay">
            <div class="tutorial-box">
                <div class="tutorial-step">
                    <span id="step-current">1</span> / <span id="step-total">4</span>
                </div>
                <h2 id="tutorial-title">Welcome</h2>
                <p id="tutorial-text">Loading...</p>
                <div class="tutorial-progress">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="tutorial-skip">Press <kbd>SPACE</kbd> to skip</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
