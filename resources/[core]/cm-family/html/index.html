<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
  <link rel="stylesheet" href="css/family-v100.css">
  <link rel="stylesheet" href="nui://cm-ui/web/cm-armory.css?v=7">
  <link rel="stylesheet" href="css/family-armory-v4.css?v=1">
</head>
<body>
  <!-- Invite toast (shown outside the menu) -->
  <div id="invite-toast" class="toast" aria-hidden="true">
    <div class="toast__inner">
      <span class="toast__title">Family invite</span>
      <span class="toast__body" id="toast-body"></span>
      <span class="toast__hint">Open <b>/family</b> to respond</span>
    </div>
  </div>

  <!-- Root menu -->
  <div id="root" class="root" aria-hidden="true">
    <div class="panel family-shell">
      <aside class="family-sidebar">
        <div class="brand family-brand">
          <span class="crest" id="crest"></span>
          <div class="brand__text"><span class="brand__kicker">CM FAMILY</span><h1 id="family-name">Family</h1><span class="brand__sub" id="family-sub"></span></div>
        </div>
        <nav class="tabs" id="tabs" aria-label="Family sections">
          <button class="tab active" data-tab="overview"><span class="tab__icon">01</span><span><strong>Family information</strong><small>Home and status</small></span></button>
          <button class="tab" data-tab="manage"><span class="tab__icon">02</span><span><strong>Management</strong><small>Family controls</small></span></button>
          <button class="tab" data-tab="members"><span class="tab__icon">03</span><span><strong>Members</strong><small>Roster and roles</small></span></button>
          <button class="tab" data-tab="ranks"><span class="tab__icon">04</span><span><strong>Ranks &amp; access</strong><small>Permission levels</small></span></button>
          <button class="tab" data-tab="vehicles"><span class="tab__icon">05</span><span><strong>Family vehicles</strong><small>Shared transport</small></span></button>
          <button class="tab" data-tab="armory"><span class="tab__icon">06</span><span><strong>Armory</strong><small>Family quartermaster</small></span></button>
          <button class="tab" data-tab="logs"><span class="tab__icon">07</span><span><strong>Activity logs</strong><small>Family history</small></span></button>
        </nav>
        <div class="family-sidebar__footer"><span>ESC</span> Close menu</div>
      </aside>
      <section class="family-workspace">
        <header class="workspace-header"><div><span class="workspace-eyebrow">FAMILY CONTROL</span><h2 id="workspace-title">Family information</h2></div><button class="icon-btn" id="btn-close" title="Close">&times;</button></header>
        <main class="content" id="content"><!-- rendered by JS --></main>
      </section>
    </div>
  </div>

  <!-- Create / join screen -->
  <div id="create" class="root" aria-hidden="true">
    <div class="panel panel--narrow">
      <header class="header">
        <div class="brand"><div class="brand__text"><h1>Start a family</h1><span class="brand__sub">Choose a house to become your family home</span></div></div>
        <button class="icon-btn" id="btn-create-close" title="Close">&times;</button>
      </header>
      <main class="content" id="create-content"></main>
    </div>
  </div>

  <div id="family-admin" class="root" aria-hidden="true">
    <div class="panel family-admin-panel">
      <header class="header">
        <div class="brand"><span class="crest"></span><div class="brand__text"><h1>Family Admin</h1><span class="brand__sub">Diagnostics, bounded recovery, and high-risk activity</span></div></div>
        <button class="icon-btn" id="family-admin-close" title="Close">&times;</button>
      </header>
      <div class="family-admin-toolbar"><input class="input" id="family-admin-search" placeholder="Search family, founder CID, or house"><span class="badge" id="family-admin-count">0 families</span></div>
      <main class="content family-admin-content"><section><div class="section-title">Families and recovery</div><div class="family-admin-list" id="family-admin-list"></div></section><section><div class="section-title">High-risk activity</div><div class="list" id="family-admin-logs"></div></section></main>
    </div>
  </div>

  <script src="js/family-v100.js"></script>
</body>
</html>
