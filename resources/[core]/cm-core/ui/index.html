<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CM-Core Bridge</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script>
        const state = {};

        window.addEventListener('message', function(event) {
            const data = event.data || {};
            if (data.action !== 'stateUpdate' || !data.namespace) return;
            state[data.namespace] = state[data.namespace] || {};
            state[data.namespace][data.key] = data.value;
        });

        setTimeout(function() {
            fetch(`https://${GetParentResourceName()}/getState`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            }).catch(function() {});
        }, 250);
    </script>
</body>
</html>
