<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM Gun Store</title>
    <link rel="stylesheet" href="style.css?v=1.11.2" />
</head>
<body>
    <!-- The "Press E" prompt and the NPC conversation are cm-ui's shared
         components (exports['cm-ui']:ShowInteract / OpenNpcDialogue) -- see
         cm-ui/docs/CM_UI_USAGE.md. This page only owns the catalog/admin UI
         that opens once the player picks "Show me what you have got". -->
    <main id="app" class="hidden">
        <section class="shell">
            <header class="topbar">
                <div>
                    <p class="eyebrow" id="modeLabel">STORE</p>
                    <h1 id="title">Gun Store</h1>
                </div>
                <div class="tabs">
                    <button class="tab active" data-filter="all">All</button>
                    <button class="tab" data-filter="weapon">Weapons</button>
                    <button class="tab" data-filter="ammo">Ammo</button>
                    <button class="tab" data-filter="armor">Armor</button>
                    <button class="tab admin-only" data-filter="npc">NPCs</button>
                </div>
                <button id="refreshBtn" class="ghost">Refresh</button>
                <button id="closeBtn" class="close">×</button>
            </header>

            <section class="content">
                <aside class="info-card">
                    <h2>Secure Catalog</h2>
                    <p>Buy weapons, ammo, and armor as inventory items. Walk to the clerk and press E to talk.</p>
                    <div class="pay-note">
                        <span>Cash</span>
                        <span>Bank</span>
                    </div>
                </aside>

                <section class="items" id="items"></section>
            </section>
        </section>
    </main>

    <!-- Only cm-ui.js's confirm()/toast() JS helpers -- a real Promise-based
         modal, unlike native window.confirm() which is unreliable in FiveM's
         CEF NUI. Modal/toast styling is gunstore's own (web/style.css) so we
         don't also pull in cm-ui's page-wide theme CSS. -->
    <script src="nui://cm-ui/web/cm-ui.js"></script>
    <script src="app.js?v=1.11.2"></script>
</body>
</html>
