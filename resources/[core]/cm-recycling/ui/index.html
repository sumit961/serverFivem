<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogers Salvage & Recycling HUD</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="recycling-hud" class="recycling-hud" style="display: none;">
        <div class="hud-card">
            <div class="hud-header">
                <div class="brand-badge">
                    <span class="pulse-dot"></span>
                    <span class="brand-title">ROGERS SALVAGE</span>
                </div>
                <div class="cycle-step" id="cycle-step">SITE 1 / 5</div>
            </div>

            <div class="site-name" id="site-name">Port Logistics Scrap Compound</div>
            <div class="material-name" id="material-name">Target: Heavy Machinery & Scrap</div>

            <div class="capacity-section">
                <div class="capacity-labels">
                    <span class="label-muted">TRUCK BED PAYLOAD</span>
                    <span class="capacity-text" id="capacity-text">0 / 10 (0%)</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="instruction-box" id="instruction-box">
                <span class="instruction-tag">OBJECTIVE</span>
                <span class="instruction-text" id="instruction-text">PROCEED TO SALVAGE PICKUP POINT</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
