<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CM Roleplay &mdash; Loading</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css" />
    <link rel="stylesheet" href="nui://cm-ui/web/cm-components.css" />
    <link rel="stylesheet" href="nui://cm-ui/web/cm-aaa.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <audio id="bgm" autoplay loop>
        <source src="audio/loading-theme.wav" type="audio/wav" />
    </audio>

    <div class="loading-root" id="loading-root">
        <div class="character-backdrop">
            <div class="slide-stack" id="slide-stack"></div>
        </div>
        <div class="cm-hero-fade"></div>
        <div class="grain"></div>

        <div class="hud-layer">
            <div class="cm-screen-bracket cm-screen-bracket--tl"></div>
            <div class="cm-screen-bracket cm-screen-bracket--bl"></div>
        </div>

        <main class="ui-panel">
            <p class="pre-title" id="tagline-text">Enter the city</p>
            <h1 class="main-title" id="server-name">CM ROLEPLAY</h1>
            <p class="subtitle" id="server-description">Preparing your connection and getting the city ready for you.</p>

            <div class="progress-block">
                <div class="progress-meta">
                    <span id="progress-label">Loading the city</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <p class="hint-text" id="tip-text">Trusted login never skips confirmation.</p>

            <div class="continue-prompt hidden" id="continue-prompt">
                <span class="continue-label">Connection ready</span>
                <span class="continue-action">Press <strong>ENTER</strong> or <strong>SPACE</strong> to continue</span>
            </div>
        </main>

        <footer class="bottom-bar">
            <button type="button" class="cm-btn cm-btn-ghost cm-btn-sm music-toggle" id="music-toggle" aria-pressed="false" aria-label="Mute loading music">&#9835;</button>
        </footer>
    </div>

    <script src="nui://cm-ui/web/cm-ui.js"></script>
    <script src="nui://cm-ui/web/cm-branding.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
