<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CM Store</title>
  <link rel="stylesheet" href="style.css?v=1.1.0" />
</head>
<body>
  <main id="app" class="hidden">
    <header>
      <div>
        <h1 id="title">Store</h1>
        <p id="subtitle">Browse items for sale</p>
      </div>
      <div class="head-actions">
        <select id="method">
          <option value="cash">Pay Cash</option>
          <option value="bank">Pay Bank</option>
        </select>
        <button id="close">Close ESC</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <section class="grid" id="grid"></section>
  </main>

  <script src="app.js?v=1.1.0"></script>
</body>
</html>
