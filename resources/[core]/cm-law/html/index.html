<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CM Law Command Center</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    .surface{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;visibility:hidden;pointer-events:none}
    .surface.active{visibility:visible;pointer-events:auto}
  </style>
</head>
<body>
  <iframe id="law" class="surface active" src="law.html" title="Legal organization dashboard"></iframe>
  <iframe id="police" class="surface" src="police/index.html" title="Los Santos Police dashboard"></iframe>
  <script>
    const surfaces = { law: document.getElementById('law'), police: document.getElementById('police') };
    const ready = { law: false, police: false };
    const queued = { law: [], police: [] };
    const panelIds = {
      law: ['app', 'legalArmory', 'wardrobeRoom', 'facilityDialogue', 'lawConfirm'],
      police: ['app', 'wardrobeRoom', 'mdtTerminal', 'impoundRelease', 'npcDialogue', 'policeQuickMenu', 'policeConfirm', 'cinematicAccessibility'],
    };
    let active = 'law';
    const hasPanel = name => ready[name] && panelIds[name].some(id => {
      const node = surfaces[name].contentDocument.getElementById(id);
      return node && !node.hidden && !node.classList.contains('hidden');
    });
    const activate = (name, focus = false) => {
      active = name;
      Object.entries(surfaces).forEach(([key, frame]) => frame.classList.toggle('active', key === name));
      if (focus && ready[name]) surfaces[name].contentWindow.focus();
    };
    const interactiveOpen = payload => ['open', 'bookingOpen', 'legalArmoryOpen', 'legalWardrobeOpen', 'policeCloset:open',
      'openMdtTerminal', 'quickMenuOpen', 'confirmOpen', 'cinematicAccessibility:open',
      'impoundRelease:open', 'npcDialogue:open'].includes(payload.action)
      || (payload.action === 'facilityDialogue' && payload.visible === true);
    const passiveOpen = payload => ['npcInteraction:show', 'showHint', 'policeCinematic:show', 'notify'].includes(payload.action)
      || (payload.action === 'facilityPrompt' && payload.visible === true);
    const forward = (name, payload) => {
      if (!ready[name]) queued[name].push(payload);
      else surfaces[name].contentWindow.postMessage(payload, '*');
    };
    Object.entries(surfaces).forEach(([name, frame]) => frame.addEventListener('load', () => {
      ready[name] = true;
      queued[name].splice(0).forEach(payload => forward(name, payload));
      // Restore the previous menu after a cross-interface confirmation closes.
      new MutationObserver(() => {
        if (hasPanel(active)) return;
        const previous = Object.keys(surfaces).find(key => key !== active && hasPanel(key));
        if (previous) activate(previous, true);
      }).observe(frame.contentDocument.body, { subtree: true, attributes: true, attributeFilter: ['hidden', 'class'] });
      if (active === name) frame.contentWindow.focus();
    }));
    window.addEventListener('message', event => {
      // Child windows do not route game messages back through the shell.
      if (Object.values(surfaces).some(frame => event.source === frame.contentWindow)) return;
      const payload = event.data || {};
      const name = payload.cmInterface === 'police' ? 'police' : payload.cmInterface === 'law' ? 'law' : active;
      if (interactiveOpen(payload)) activate(name, true);
      else if (passiveOpen(payload) && !hasPanel(active)) activate(name);
      forward(name, payload);
    });
    // NUI focus may initially land on the shell instead of its iframe.
    document.addEventListener('keydown', event => {
      if (!['Escape', 'Esc'].includes(event.key) && event.keyCode !== 27) return;
      event.preventDefault();
      if (!event.repeat) surfaces[active].contentWindow.cmHandleEscape?.();
    });
  </script>
</body>
</html>
