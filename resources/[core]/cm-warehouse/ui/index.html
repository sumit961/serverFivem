<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Warehouse Job</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="warehouse-hud" class="warehouse-hud" style="display: none;">
        <div class="hud-card">
            <div class="hud-header">
                <div class="brand-badge">
                    <span class="pulse-dot"></span>
                    <span class="brand-title">PORT LOGISTICS & WAREHOUSE</span>
                </div>
                <div class="stage-step" id="stage-step">STAGE 1 / 4</div>
            </div>

            <div class="manifest-title" id="manifest-title">Municipal Consumer Goods</div>
            <div class="stage-name" id="stage-name">Physical Receiving: Container Inspection</div>

            <div class="progress-section">
                <div class="progress-labels">
                    <span class="label-muted" id="progress-status-label">MANIFEST PROGRESS</span>
                    <span class="progress-percent" id="progress-percent">25%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill" style="width: 25%;"></div>
                </div>
            </div>

            <div class="instruction-box" id="instruction-box">
                <span class="instruction-tag">OBJECTIVE</span>
                <span class="instruction-text" id="instruction-text">PROCEED TO RECEIVING BAY</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
