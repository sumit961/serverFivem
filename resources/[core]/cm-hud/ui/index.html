<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM HUD</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="nui://cm-ui/web/cm-components.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="hud-hidden">
    <div id="hud-container">
        <!-- TOP RIGHT: Server info, ID, players, money -->
        <div id="hud-top-right" class="hud-module"></div>

        <!-- BOTTOM LEFT: Location only, placed right of native minimap -->
        <div id="hud-bottom-left" class="hud-module"></div>

        <!-- LEFT MIDDLE: Quick key/action guide -->
        <div id="hud-left-keys" class="hud-module"></div>

        <!-- RIGHT MIDDLE: Voice / family radio / org radio status -->
        <div id="hud-voice-radio" class="hud-module"></div>

        <!-- BOTTOM RIGHT: Time, Date, Key icons -->
        <div id="hud-bottom-right" class="hud-module"></div>

        <!-- Vehicle HUD: renderer chosen by vehicle type (car/electric/air/boat/bike) -->
        <div id="hud-vehicle" class="hud-module hidden"></div>

        <!-- CENTER: Death screen -->
        <div id="hud-death" class="hud-module hidden"></div>

        <!-- CENTER: Notifications (future) -->
        <div id="hud-notify" class="hud-module"></div>
    </div>

    <!-- HUD ADMIN: opened with /hud admin -->
    <div id="hud-admin" class="hidden"></div>

    <script src="nui://cm-ui/web/cm-ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
