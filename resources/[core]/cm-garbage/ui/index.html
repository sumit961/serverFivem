<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Garbage Job</title>
    <link rel="stylesheet" href="nui://cm-ui/web/cm-theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="garbage-hud" class="garbage-hud" style="display: none;">
        <div class="hud-card">
            <div class="hud-header">
                <div class="brand-badge">
                    <span class="pulse-dot"></span>
                    <span class="brand-title">PUBLIC SANITATION</span>
                </div>
                <div class="route-step" id="route-step">STOP 1 / 8</div>
            </div>

            <div class="stop-name" id="stop-name">Innocence Blvd Residential</div>

            <div class="capacity-section">
                <div class="capacity-labels">
                    <span class="label-muted">COMPACTOR LOAD</span>
                    <span class="capacity-text" id="capacity-text">0 / 16 (0%)</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="instruction-box" id="instruction-box">
                <span class="instruction-tag">OBJECTIVE</span>
                <span class="instruction-text" id="instruction-text">PROCEED TO COLLECTION STOP</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
