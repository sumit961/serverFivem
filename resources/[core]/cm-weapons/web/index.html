<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CM Weapons Admin</title>
  <link rel="stylesheet" href="style.css?v=110" />
</head>
<body>
  <main id="app" class="hidden">
    <section class="panel">
      <aside class="sidebar">
        <div class="eyebrow">Catalog Admin</div>
        <h1>CM<br/>Weapons</h1>
        <p>Central place for fixed guns, fixed ammo, pickup hashes, damage, images, and cm-items sync. Store prices are handled in /gunadmin.</p>
        <div class="counts">
          <span id="ammoCount">Ammo: 0</span>
          <span id="weaponCount">Weapons: 0</span>
        </div>
        <button id="syncItems" class="ghost wide">Sync to cm-items</button>
      </aside>

      <section class="content">
        <header class="topbar">
          <div class="tabs">
            <button class="tab active" data-tab="ammo">Ammo</button>
            <button class="tab" data-tab="weapons">Weapons</button>
          </div>
          <div class="top-actions">
            <input id="search" placeholder="Search weapon, ammo, hash..." />
            <button id="refresh" class="ghost">Refresh</button>
            <button id="close" class="round">×</button>
          </div>
        </header>

        <div id="notice" class="notice hidden"></div>

        <section id="ammoTab" class="tabpage active">
          <div class="split">
            <div class="listBlock">
              <div class="blockTitle">Saved Ammo</div>
              <div id="ammoList" class="cards smallCards"></div>
            </div>
            <form id="ammoForm" class="editor">
              <div class="blockTitle">Ammo Settings</div>
              <div class="grid2">
                <label>Item Name<input name="itemName" placeholder="ammo_9mm" required /></label>
                <label>Label<input name="label" placeholder="9mm Ammo" required /></label>
                <label>Ammo Type<select name="ammoKey" id="ammoKeySelect"></select></label>
                <label>Pickup Hash<input name="pickupHash" readonly /></label>
                <label>Pack Size<input name="packSize" type="number" min="1" value="30" /></label>
                <label>Weight / round<input name="weight" type="number" min="0" value="10" /></label>
                <label>Sort Order<input name="sortOrder" type="number" value="0" /></label>
              </div>
              <label>Image Path / URL<input name="image" placeholder="nui://cm-weapons/web/images/custom/ammo_9mm.png or https://..." /></label>
              <label class="wide file-line">Upload Ammo Image<input id="ammoImageFile" name="imageFile" type="file" accept="image/png,image/jpeg,image/webp" /></label>
              <label>Description<textarea name="description" placeholder="Short description"></textarea></label>
              <div class="checks">
                <label class="check"><input name="enabled" type="checkbox" checked /> Enabled item</label>
                <label class="check"><input name="stack" type="checkbox" checked /> Stack in inventory</label>
              </div>
              <div class="actions stickyActions">
                <button type="button" id="newAmmo" class="ghost">New</button>
                <button type="submit" class="primary">Save Ammo</button>
                <button type="button" id="deleteAmmo" class="danger">Delete</button>
              </div>
            </form>
          </div>
        </section>

        <section id="weaponsTab" class="tabpage">
          <div class="split">
            <div class="listBlock">
              <div class="blockTitle">Saved Weapons</div>
              <div id="weaponList" class="cards"></div>
            </div>
            <form id="weaponForm" class="editor">
              <div class="blockTitle">Weapon Settings</div>
              <div class="pickerRow">
                <select id="defaultWeaponPicker"><option value="">Pick from fixed GTA weapon list...</option></select>
                <button type="button" id="fillWeapon" class="ghost">Use</button>
              </div>
              <div class="grid2">
                <label>Item Name<input name="itemName" placeholder="weapon_pistol" required /></label>
                <label>Label<input name="label" placeholder="Pistol" required /></label>
                <label>Weapon Hash<input name="weaponHash" placeholder="WEAPON_PISTOL" required /></label>
                <label>Group<input name="group" placeholder="pistol / rifle / shotgun" /></label>
                <label>Ammo Used<select name="ammoItem" id="weaponAmmoSelect"></select></label>
                <label>Damage / Bullet<input name="damage" type="number" min="0" value="25" /></label>
                <label>Magazine Size<input name="magazineSize" type="number" min="0" value="12" /></label>
                <label>Weight<input name="weight" type="number" min="0" value="1000" /></label>
                <label>Sort Order<input name="sortOrder" type="number" value="0" /></label>
              </div>
              <label>Image Path / URL<input name="image" placeholder="https://docs-backend.fivem.net/weapons/WEAPON_PISTOL.png" /></label>
              <label class="wide file-line">Upload Weapon Image<input id="weaponImageFile" name="imageFile" type="file" accept="image/png,image/jpeg,image/webp" /></label>
              <label>Description<textarea name="description" placeholder="Short description"></textarea></label>
              <div class="checks">
                <label class="check"><input name="enabled" type="checkbox" checked /> Enabled item</label>
              </div>
              <div class="actions stickyActions">
                <button type="button" id="newWeapon" class="ghost">New</button>
                <button type="submit" class="primary">Save Weapon</button>
                <button type="button" id="deleteWeapon" class="danger">Delete</button>
              </div>
            </form>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script src="app.js?v=110"></script>
</body>
</html>
